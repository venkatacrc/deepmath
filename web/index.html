<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <meta name="description" content="Flash cards for the mathematics of modern deep learning, from Grade 5 to Masters, with paper-style notation.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Deep Math">
    <title>Deep Math</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="katex/katex.min.css">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div id="app">
        <header class="topbar">
            <button class="icon-btn" id="open-drawer" aria-label="Topics and options">☰</button>
            <div class="brand"><span class="nabla" aria-hidden="true">∇</span> Deep Math</div>
            <button class="icon-btn" id="speak-btn" aria-label="Read aloud" title="Read aloud" hidden>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>
                </svg>
            </button>
        </header>
        <div class="switches">
            <div class="segmented" id="kind-switch">
                <button data-value="notation">Notation</button>
                <button data-value="equations">Equations</button>
                <button data-value="both">Both</button>
            </div>
            <div class="segmented" id="study-switch">
                <button data-value="learn">Learn</button>
                <button data-value="test">Test</button>
            </div>
        </div>
        <div class="status" id="status"></div>
        <main id="stage"></main>
        <nav class="actions" id="actions"></nav>
    </div>

    <div class="backdrop" id="backdrop" hidden></div>
    <aside class="drawer" id="drawer" aria-hidden="true">
        <div class="drawer-head">
            <div class="brand"><span class="nabla" aria-hidden="true">∇</span> Deep Math</div>
            <button class="icon-btn" id="close-drawer" aria-label="Close">✕</button>
        </div>
        <div class="drawer-body" id="drawer-body"></div>
        <div class="drawer-foot" id="drawer-foot"></div>
    </aside>

    <script src="katex/katex.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
